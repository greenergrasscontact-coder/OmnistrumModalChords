  padding: 6px 12px; border-radius: 999px; cursor: pointer; transition: all 0.18s ease;
}
.prog-toggle:hover { color: var(--ink-2); border-color: var(--line); }
.prog-toggle.active { color: var(--gold); border-color: rgba(212, 169, 106, 0.4); background: rgba(212, 169, 106, 0.06); }
.prog-slot-meta { display: flex; gap: 4px; flex-wrap: wrap; min-height: 14px; }
.prog-meta-pill { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); background: var(--bg); padding: 2px 5px; border-radius: 4px; }
.prog-slot-arp { display: flex; gap: 3px; margin-top: 8px; justify-content: center; }
.prog-arp-btn {
  flex: 1; min-width: 0; font-size: 11px; line-height: 1; color: var(--ink-3);
  background: var(--surface-3); border: 1px solid var(--line-soft);
  border-radius: 5px; padding: 4px 0; cursor: pointer; transition: all 0.15s ease;
}
.prog-arp-btn:hover { color: var(--ink-2); border-color: var(--line); }
.prog-arp-btn.active { background: var(--gold); color: var(--bg); border-color: var(--gold); }
.prog-slot-arrows { display: flex; justify-content: space-between; margin-top: 8px; padding-top: 4px; border-top: 1px solid var(--line-soft); }
.prog-slot-arrows button { background: transparent; border: none; color: var(--ink-3); cursor: pointer; font-size: 13px; padding: 2px 10px; border-radius: 4px; transition: all 0.15s ease; }
.prog-slot-arrows button:hover:not(:disabled) { color: var(--ink); background: var(--bg); }
.prog-slot-arrows button:disabled { opacity: 0.25; cursor: not-allowed; }

/* Controls */
.controls {
  display: flex; flex-direction: column; gap: 22px; margin-bottom: 28px;
  padding: 22px 24px; background: linear-gradient(180deg, var(--surface), var(--surface-2));
  border: 1px solid var(--line-soft); border-radius: 14px;
}
.control-row { display: flex; flex-wrap: wrap; gap: 32px; }
.control-label { display: block; font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 10px; }
.type-toggle { display: inline-flex; background: var(--surface-3); border: 1px solid var(--line-soft); border-radius: 999px; padding: 3px; gap: 2px; }
.type-pill { font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 500; background: transparent; color: var(--ink-3); border: none; padding: 8px 22px; border-radius: 999px; cursor: pointer; transition: all 0.18s ease; }
.type-pill:hover { color: var(--ink-2); }
.type-pill.active { background: var(--gold); color: var(--bg); font-weight: 600; }

.voicing-grid {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  background: var(--surface-3); border: 1px solid var(--line-soft);
  border-radius: 12px; padding: 4px;
}
.voicing-pill {
  font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 500;
  background: transparent; color: var(--ink-3); border: none;
  padding: 7px 14px; border-radius: 999px; cursor: pointer;
  transition: all 0.18s ease; letter-spacing: 0.01em;
}
.voicing-pill:hover { color: var(--ink-2); }
.voicing-pill.active { background: var(--gold); color: var(--bg); font-weight: 600; }
.voicing-pill.variant { font-size: 11px; padding: 7px 11px; }
.voicing-pill.variant.active { background: var(--copper); color: var(--bg); }
.voicing-divider {
  width: 1px; align-self: stretch; background: var(--line-soft); margin: 4px 4px;
}

.root-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; }
.root-pill { font-family: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size: 16px; font-weight: 500; background: var(--surface-3); color: var(--ink-2); border: 1px solid var(--line-soft); padding: 10px 0; border-radius: 8px; cursor: pointer; transition: all 0.15s ease; }
.root-pill:hover { color: var(--ink); border-color: var(--line); }
.root-pill.active { background: var(--gold); color: var(--bg); border-color: var(--gold); font-weight: 600; }

.mode-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.mode-pill { font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 500; background: var(--surface-3); color: var(--ink-2); border: 1px solid var(--line-soft); padding: 9px 18px; border-radius: 999px; cursor: pointer; transition: all 0.15s ease; }
.mode-pill:hover { color: var(--ink); border-color: var(--line); }
.mode-pill.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Chord Finder */
.chord-finder { margin-bottom: 28px; background: linear-gradient(180deg, var(--surface-2), var(--surface)); border: 1px solid var(--line-soft); border-radius: 14px; overflow: hidden; transition: border-color 0.2s ease; }
.chord-finder.open { border-color: var(--line); }
.finder-header { display: flex; align-items: center; justify-content: space-between; width: 100%; background: transparent; border: none; padding: 16px 22px; cursor: pointer; font: inherit; color: inherit; text-align: left; transition: background 0.15s ease; }
.finder-header:hover { background: rgba(255, 255, 255, 0.02); }
.finder-title-group { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.finder-title { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-2); }
.finder-subtitle { font-family: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-style: italic; font-size: 13px; color: var(--ink-3); }
.finder-found-pill { font-family: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size: 18px; font-weight: 500; letter-spacing: -0.01em; }
.finder-toggle { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 14px; color: var(--ink-3); }

.finder-body { padding: 4px 22px 22px; display: flex; flex-direction: column; gap: 18px; animation: fadeUp 0.35s cubic-bezier(0.2, 0.8, 0.2, 1); }
.finder-diagram-wrap { display: flex; justify-content: center; padding: 14px 0 4px; overflow-x: auto; }

.finder-results { display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 56px; }
.finder-status { font-family: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-style: italic; font-size: 14px; color: var(--ink-3); padding: 18px 0; }
.finder-chord-display { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.finder-chord-name { font-family: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size: 36px; font-weight: 500; letter-spacing: -0.02em; line-height: 1; font-variation-settings: 'opsz' 144; }
.finder-chord-meta { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
.finder-chord-spelling { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.04em; color: var(--ink-2); margin-top: 2px; display: block; }
.finder-alternatives { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; letter-spacing: 0.08em; color: var(--ink-3); margin-top: 4px; }

.finder-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.finder-btn-secondary, .finder-btn-primary {
  font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  padding: 8px 16px; border-radius: 999px; cursor: pointer; transition: all 0.18s ease;
}
.finder-btn-secondary { background: transparent; color: var(--ink-2); border: 1px solid var(--line-soft); }
.finder-btn-secondary:hover:not(:disabled) { color: var(--ink); border-color: var(--line); }
.finder-btn-primary { background: var(--gold); color: var(--bg); border: 1px solid var(--gold); font-weight: 600; }
.finder-btn-primary:hover:not(:disabled) { background: var(--gold-bright); border-color: var(--gold-bright); }
.finder-btn-secondary:disabled, .finder-btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }

/* Interactive piano */
.finder-key-white { fill: var(--paper); stroke: #2a1f12; stroke-width: 0.5; cursor: pointer; transition: fill 0.12s ease; }
.finder-key-white:hover { fill: #f6ecd2; }
.finder-key-white.active { fill: #f0d8a4; }
.finder-key-black { fill: #1a140e; stroke: #2a2218; stroke-width: 0.5; cursor: pointer; transition: fill 0.12s ease; }
.finder-key-black:hover { fill: #2a2218; }
.finder-key-black.active { fill: #4a3a22; }
.finder-marker { filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.6)); }

/* Interactive fretboard */
.fretboard-label { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; fill: var(--ink-3); letter-spacing: 0.05em; }
.fretboard-string { stroke: #b8a07b; stroke-opacity: 0.55; }
.fretboard-nut { stroke: var(--paper); stroke-width: 3; }
.fretboard-fret-line { stroke: #4a4239; stroke-opacity: 0.7; stroke-width: 1; }
.fretboard-inlay { fill: #3a3127; opacity: 0.5; }
.fretboard-click { cursor: pointer; }
.fretboard-click:hover { fill: rgba(212, 169, 106, 0.06); }
.fretboard-marker-label { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 9px; fill: var(--bg); font-weight: 700; }
.fretboard-marker-label-open { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 9px; font-weight: 700; }

.card-tones-fallback {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 200px; width: 178px; gap: 14px; text-align: center;
  background: rgba(0, 0, 0, 0.18); border-radius: 10px;
}
.card-fallback-label {
  font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--ink-3);
}
.card-fallback-notes {
  font-family: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size: 18px; font-style: italic;
  color: var(--ink-2); line-height: 1.6; letter-spacing: 0.02em;
  padding: 0 12px;
}

/* Voicing position pills on chord cards */
.voicing-positions {
  display: flex; flex-wrap: wrap; gap: 4px; justify-content: center;
  margin: 0 0 8px;
}
/* Armed state for confirm-before-destroying buttons */
.armed {
  background: var(--copper) !important;
  color: var(--bg) !important;
  border-color: var(--copper) !important;
  opacity: 1 !important;
  font-size: 9px !important;
  letter-spacing: 0.04em;
  padding-left: 6px !important; padding-right: 6px !important;
  animation: armPulse 0.9s ease-in-out infinite;
}
@keyframes armPulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.25); } }
.pos-pill-hide.armed { width: auto; }

/* Chord note map on the card */
.card-map-btn {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--surface-3); border: 1px solid var(--line-soft); color: var(--ink-3);
  cursor: pointer; font-size: 12px; line-height: 1; display: flex; align-items: center;
  justify-content: center; transition: all 0.18s ease; padding: 0;
}
.card-map-btn:hover { background: var(--gold); color: var(--bg); border-color: var(--gold); transform: scale(1.08); }
.card-map-btn.active { background: var(--gold); color: var(--bg); border-color: var(--gold); }
.card-map {
  margin: 10px 0 4px; padding: 8px 8px 6px;
  background: var(--bg); border: 1px solid var(--line-soft); border-radius: 10px;
  animation: slotIn 0.28s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
}
.card-map-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.cnm-svg { display: block; }
.cnm-fret-num {
  font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 9px;
  fill: var(--ink-3); letter-spacing: 0.04em;
}
.cnm-label {
  font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  font-size: 8.5px; font-weight: 700;
}
.card-map-hint {
  display: block; margin-top: 5px; text-align: center;
  font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif; font-style: italic;
  font-size: 10px; color: var(--ink-3);
}

.pos-pill-wrap { display: inline-flex; align-items: stretch; }
.pos-pill.mine { border-color: rgba(212,169,106,0.55); color: var(--gold); }
.pos-pill-hide {
  background: transparent; border: none; color: var(--ink-3); cursor: pointer;
  font-size: 11px; line-height: 1; padding: 0 4px 0 2px; opacity: 0.35;
  transition: all 0.15s ease;
}
.pos-pill-hide:hover { opacity: 1; color: var(--copper); }

/* Save-a-shape controls in the chord finder */
.finder-shape-bar {
  margin: 4px 0 12px; padding: 10px 12px; border-radius: 10px;
  background: var(--surface-2); border: 1px solid var(--line-soft);
}
.finder-shape-label {
  display: block; font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif;
  font-style: italic; font-size: 12px; color: var(--ink-3); margin-bottom: 8px;
}
.finder-shape-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.finder-shape-btn {
  font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 10px;
  letter-spacing: 0.05em; background: transparent; color: var(--ink-3);
  border: 1px solid var(--line-soft); padding: 6px 12px; border-radius: 999px;
  cursor: pointer; transition: all 0.16s ease;
}
.finder-shape-btn:hover { color: var(--gold); border-color: rgba(212,169,106,0.5); background: rgba(212,169,106,0.07); }
.finder-saved { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.finder-saved-chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 10px;
  color: var(--ink-2); background: var(--surface-3);
  border: 1px solid var(--line-soft); border-radius: 999px; padding: 4px 8px;
}
.finder-saved-chip button {
  background: transparent; border: none; color: var(--ink-3); cursor: pointer;
  font-size: 12px; line-height: 1; padding: 0;
}
.finder-saved-chip button:hover { color: var(--copper); }

.pos-pill {
  font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
  background: transparent; color: var(--ink-3);
  border: 1px solid var(--line-soft);
  padding: 4px 9px; border-radius: 999px; cursor: pointer;
  transition: all 0.15s ease;
}
.pos-pill:hover { color: var(--ink-2); border-color: var(--line); }
.pos-pill.active {
  background: var(--gold); color: var(--bg);
  border-color: var(--gold); font-weight: 700;
}

/* Per-card quality picker */
.control-hint {
  display: block; margin-top: 6px;
  font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-style: italic;
  color: var(--ink-3); letter-spacing: 0.01em;
}
.chord-quality-btn {
  font-family: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-style: italic; font-size: 13px;
  background: transparent; border: none;
  color: var(--ink-3); cursor: pointer;
  padding: 2px 6px 2px 4px; border-radius: 4px;
  transition: all 0.15s ease;
  letter-spacing: 0.01em;
}
.chord-quality-btn:hover {
  color: var(--ink-2);
  background: rgba(255, 255, 255, 0.04);
}
.chord-quality-btn.overridden {
  color: var(--copper);
  font-weight: 500;
}
.quality-picker-menu {
  position: absolute;
  top: calc(100% - 8px); left: 12px; right: 12px;
  background: var(--surface-2, var(--surface));
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  z-index: 120;
  max-height: min(58vh, 420px); overflow-y: auto; overscroll-behavior: contain;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
  margin-top: 14px;
}
.quality-reset {
  display: block; width: 100%; margin-bottom: 8px;
  font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 9px;
  letter-spacing: 0.12em; text-transform: uppercase;
  background: transparent; color: var(--ink-3);
  border: 1px solid var(--line-soft); padding: 6px;
  border-radius: 6px; cursor: pointer;
  transition: all 0.15s ease;
}
.quality-reset:hover { color: var(--ink); border-color: var(--gold); }
.quality-group { margin: 8px 0; }
.quality-group-label {
  display: block;
  font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 8.5px;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 5px;
}
.quality-group-buttons { display: flex; flex-wrap: wrap; gap: 4px; }
.quality-option {
  font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px;
  background: transparent; color: var(--ink-2);
  border: 1px solid var(--line-soft);
  padding: 4px 9px; border-radius: 4px;
  cursor: pointer; transition: all 0.15s ease;
}
.quality-option:hover { color: var(--ink); border-color: var(--line); }
.quality-option.active {
  background: var(--gold); color: var(--bg);
  border-color: var(--gold); font-weight: 600;
}

/* Scale map */
.scale-map-section {
  position: relative; z-index: 1;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: 12px;
  padding: 16px 20px;
  margin: 0 0 20px;
}
.scale-map-header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.scale-map-play {
  font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.04em;
  background: transparent; color: var(--ink-3); border: 1px solid var(--line-soft);
  padding: 5px 12px; border-radius: 999px; cursor: pointer; transition: all 0.18s ease;
  white-space: nowrap;
}
.scale-map-play:hover { color: var(--gold); border-color: rgba(212,169,106,0.45); background: rgba(212,169,106,0.06); }
.scale-map-toggle {
  display: flex; align-items: baseline; gap: 12px;
  background: transparent; border: none; cursor: pointer; color: inherit;
  padding: 0; text-align: left;
}
.scale-map-arrow {
  font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px;
  color: var(--ink-3); width: 14px; display: inline-block;
}
.scale-map-title {
  font-family: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size: 22px; font-weight: 500;
  color: var(--ink); letter-spacing: -0.005em;
}
.scale-map-subtitle {
  font-family: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-style: italic; font-size: 14px;
  color: var(--ink-3);
}
.scale-map-chord-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  margin: 14px 0 12px;
}
.scale-map-chord-label {
  font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10px;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-3); margin-right: 4px;
}
.scale-map-chord-pill {
  font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 500;
  background: transparent; color: var(--ink-3);
  border: 1px solid var(--line-soft);
  padding: 5px 12px; border-radius: 999px; cursor: pointer;
  transition: all 0.18s ease;
}
.scale-map-chord-pill:hover { color: var(--ink-2); border-color: var(--line); }
.scale-map-chord-pill.active {
  background: var(--gold); color: var(--bg);
  border-color: var(--gold); font-weight: 600;
}
.scale-map-label-toggle {
  display: inline-flex; gap: 2px; margin-left: auto;
  background: var(--surface-3); border: 1px solid var(--line-soft);
  border-radius: 999px; padding: 2px;
}
.scale-map-labelbtn {
  font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; letter-spacing: 0.06em;
  background: transparent; color: var(--ink-3); border: none;
  padding: 4px 10px; border-radius: 999px; cursor: pointer; transition: all 0.16s ease;
}
.scale-map-labelbtn:hover { color: var(--ink-2); }
.scale-map-labelbtn.active { background: var(--gold); color: var(--bg); font-weight: 600; }
.scale-map-canvas {
  overflow-x: auto;
  margin: 8px -4px;
  padding: 4px;
}
.scale-map-svg, .scale-keyboard-map-svg { display: block; }
.scale-map-string-label {
  font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px;
  fill: var(--ink-3); font-weight: 500;
}
.scale-map-fret-num {
  font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10px;
  fill: var(--ink-3); letter-spacing: 0.05em;
}
.scale-map-note-label {
  font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 9.5px; font-weight: 700;
}
/* Scale-map keyboard: keys keep real piano colouring; scale tones are marked
   with dots, matching the fretboard map's visual language. */
.skm-white { fill: #e8dcc6; stroke: #7a6a52; stroke-width: 0.6; }
.skm-black { fill: #1c1713; stroke: #000; stroke-width: 0.6; }
.skm-octave-line { stroke: rgba(122, 106, 82, 0.55); stroke-width: 1.2; }
.scale-map-legend {
  display: flex; flex-wrap: wrap; gap: 18px; margin-top: 10px;
  font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10px;
  color: var(--ink-3); letter-spacing: 0.04em;
}
.scale-map-legend-item { display: flex; align-items: center; gap: 6px; }
.legend-dot {
  width: 10px; height: 10px; border-radius: 50%;
  display: inline-block;
}
.legend-dot.legend-outline {
  background: var(--surface-3);
  border: 1.5px solid var(--ink-3);
}

/* Mode banner */
.mode-banner { margin-bottom: 36px; animation: fadeUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); }
.mode-banner-inner { border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); padding: 28px 4px; }
.mode-title-line { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; margin-bottom: 10px; }
.mode-title { font-family: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size: clamp(40px, 7vw, 76px); font-weight: 400; letter-spacing: -0.03em; line-height: 0.95; margin: 0; color: var(--ink); }
.mode-subtitle { font-family: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-style: italic; font-size: 16px; color: var(--gold); letter-spacing: 0.01em; }
.mode-flavor { font-size: 14px; color: var(--ink-3); margin: 0 0 18px; max-width: 600px; line-height: 1.5; }
.scale-notes { display: flex; gap: 4px; flex-wrap: wrap; }
.scale-note { display: inline-flex; align-items: baseline; gap: 6px; background: var(--surface); border: 1px solid var(--line-soft); padding: 7px 12px; border-radius: 6px; }
.scale-deg { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 9px; color: var(--ink-3); letter-spacing: 0.05em; }
.scale-name { font-family: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size: 14px; color: var(--ink); font-weight: 500; }

/* Chord cards */
.chord-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px;
  position: relative; z-index: 20; }
.chord-card {
  position: relative; text-align: left; overflow: visible; z-index: 1;
  background: linear-gradient(165deg, var(--surface-2) 0%, var(--surface) 100%);
  border: 1px solid var(--line-soft); border-radius: 12px; padding: 16px 18px 14px;
  cursor: pointer; font: inherit; color: inherit;
  transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.25s ease, box-shadow 0.25s ease;
  opacity: 0; animation: cardIn 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; outline: none;
}
.chord-card.menu-open { z-index: 100; }
.chord-card.menu-open:hover { transform: none; }
.chord-card:hover { transform: translateY(-3px); border-color: var(--line); box-shadow: 0 18px 40px -20px rgba(0, 0, 0, 0.7); }
.chord-card:focus-visible { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(212, 169, 106, 0.25); }
.chord-card:active { transform: translateY(-1px); }

.chord-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; gap: 8px; }
.chord-degree-group { display: flex; align-items: baseline; gap: 8px; }
.chord-degree { font-family: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-style: italic; font-size: 18px; font-weight: 500; letter-spacing: 0.02em; }
.chord-quality { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }

.add-to-prog {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--surface-3); border: 1px solid var(--line); color: var(--ink-2);
  cursor: pointer; font-size: 18px; line-height: 1; display: flex; align-items: center; justify-content: center;
  font-weight: 300; transition: all 0.18s ease; padding: 0; flex-shrink: 0;
}
.add-to-prog:hover { background: var(--gold); color: var(--bg); border-color: var(--gold); transform: scale(1.08); }
.add-to-prog:active { transform: scale(0.95); }
.card-actions { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.card-edit-btn {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--surface-3); border: 1px solid var(--line-soft); color: var(--ink-3);
  cursor: pointer; font-size: 12px; line-height: 1; display: flex; align-items: center; justify-content: center;
  transition: all 0.18s ease; padding: 0;
}
.card-edit-btn:hover { background: var(--copper); color: var(--bg); border-color: var(--copper); transform: scale(1.08); }
.card-edit-btn:active { transform: scale(0.95); }

/* Chord finder: octave window + edit banner */
.finder-octave-bar {
  display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
  gap: 10px; margin: 2px 0 10px;
}
.finder-oct-btn {
  font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; letter-spacing: 0.08em;
  background: transparent; color: var(--ink-3); border: 1px solid var(--line-soft);
  padding: 5px 11px; border-radius: 999px; cursor: pointer; transition: all 0.16s ease;
}
.finder-oct-btn:hover:not(:disabled) { color: var(--gold); border-color: rgba(212,169,106,0.45); }
.finder-oct-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.finder-oct-range {
  font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; color: var(--ink-2);
  letter-spacing: 0.06em; min-width: 78px; text-align: center;
}
.finder-offscreen {
  font-family: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-style: italic; font-size: 11px; color: var(--copper);
}
.finder-edit-banner {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin-bottom: 10px; padding: 7px 12px;
  background: rgba(201, 122, 90, 0.1); border: 1px solid rgba(201, 122, 90, 0.35);
  border-radius: 8px;
  font-family: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-style: italic; font-size: 12px; color: var(--ink-2);
}
.finder-edit-banner strong { font-style: normal; color: var(--copper); }
.finder-edit-cancel {
  font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; letter-spacing: 0.08em;
  background: transparent; border: 1px solid var(--line-soft); color: var(--ink-3);
  padding: 3px 9px; border-radius: 999px; cursor: pointer; transition: all 0.16s ease;
}
.finder-edit-cancel:hover { color: var(--ink); border-color: var(--line); }

.chord-name-wrap { margin-bottom: 4px; }
.chord-name { font-family: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-weight: 400; letter-spacing: -0.02em; margin: 0; line-height: 1; color: var(--ink); }
.diagram-wrap { display: flex; justify-content: center; margin: 4px 0 6px; }
.diagram-wrap.piano { margin: 18px 0 22px; }
.chord-tones { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; letter-spacing: 0.08em; color: var(--ink-3); text-align: center; padding: 8px 0 10px; border-top: 1px solid var(--line-soft); }

.chord-controls { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px 12px; padding-top: 8px; border-top: 1px solid var(--line-soft); font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; }
.control-group { display: flex; align-items: center; gap: 6px; }
.ctrl-key { color: var(--ink-3); font-size: 8.5px; }
.ctrl-bar { display: inline-flex; align-items: center; background: var(--bg); border: 1px solid var(--line-soft); border-radius: 999px; padding: 2px; gap: 1px; }
.ctrl-btn { font-family: inherit; font-size: 10px; background: transparent; color: var(--ink-2); border: none; padding: 3px 0; min-width: 20px; border-radius: 999px; cursor: pointer; transition: all 0.15s ease; line-height: 1; }
.ctrl-btn:hover:not(:disabled):not(.active) { color: var(--ink); background: var(--surface-3); }
.ctrl-btn.active { background: var(--gold); color: var(--bg); font-weight: 700; }
.ctrl-btn:disabled { opacity: 0.28; cursor: not-allowed; }
.ctrl-value { color: var(--ink-2); min-width: 22px; text-align: center; font-size: 10px; padding: 0 2px; }

/* Diagram styles */
.diagram-svg { display: block; }
.chord-string { stroke: #b8a07b; stroke-opacity: 0.55; }
.chord-fret { stroke: #4a4239; stroke-opacity: 0.7; }
.chord-nut { fill: var(--paper); opacity: 0.85; }
.chord-mark { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: var(--ink-3); }
.chord-open { stroke: var(--ink-2); stroke-width: 1.2; }
.chord-fret-label { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 9px; fill: var(--ink-3); }
.chord-dot { filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.4)); }
.chord-dot-label { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 8px; font-weight: 700; pointer-events: none; }
.chord-note-label-open { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 7.5px; font-weight: 700; pointer-events: none; }
.chord-note-label-root { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 7.5px; font-weight: 700; pointer-events: none; }
.chord-capo { fill: var(--copper); filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.5)); }
.chord-capo-label { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 7.5px; font-weight: 700; fill: var(--copper); letter-spacing: 0.05em; }

/* Capo selector in controls */
.capo-grid {
  display: flex; flex-wrap: wrap; gap: 4px;
  background: var(--surface-3); border: 1px solid var(--line-soft);
  border-radius: 12px; padding: 4px;
}
.capo-pill {
  font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; font-weight: 600;
  background: transparent; color: var(--ink-3); border: none;
  padding: 7px 11px; border-radius: 999px; cursor: pointer;
  transition: all 0.18s ease; min-width: 30px;
  letter-spacing: 0.04em;
}
.capo-pill:hover { color: var(--ink-2); }
.capo-pill.active { background: var(--copper); color: var(--bg); }
.capo-pill.auto { font-style: italic; padding-left: 13px; padding-right: 13px; }
.capo-pill.auto.active { background: var(--gold); }

.piano-white { fill: var(--paper); stroke: #2a1f12; stroke-width: 0.5; }
.piano-sep { stroke: var(--paper-shadow); stroke-width: 0.4; opacity: 0.55; }
.piano-octave-line { stroke: var(--paper-shadow); stroke-width: 0.8; opacity: 0.85; }
.piano-frame { stroke: #1a1208; stroke-width: 1; }
.piano-black { fill: #1a140e; stroke: #2a2218; stroke-width: 0.5; }
.piano-marker { filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.5)); }
.piano-marker-label { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 7px; font-weight: 700; pointer-events: none; }

/* Footer */
.footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line-soft); font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; letter-spacing: 0.1em; color: var(--ink-3); text-align: center; }

/* Animations */
@keyframes cardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slotIn { from { opacity: 0; transform: scale(0.85) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }

@media (max-width: 640px) {
  .app-root { padding: 20px 16px 40px; }
  .header { flex-direction: column; align-items: flex-start; }
  .root-grid { grid-template-columns: repeat(6, 1fr); }
  .controls { padding: 18px; }
  .control-row { gap: 20px; }
  .progression { padding: 16px; }
  .mode-banner-inner { padding: 22px 0; }
  .chord-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .chord-card { padding: 14px; }
  .prog-slot { width: 120px; }
  .finder-body { padding: 4px 16px 18px; }
  .finder-chord-name { font-size: 28px; }
  .finder-actions { gap: 6px; }
  /* Keep every header control reachable on a narrow phone: the action buttons
     get their own full-width row instead of overflowing off-screen. */
  .prog-header { flex-direction: column; align-items: stretch; }
  .prog-actions { justify-content: flex-start; width: 100%; }
  .prog-actions > button { flex: 1 1 auto; text-align: center; }
  .prog-playback { gap: 10px; }
  .prog-playback .prog-play { flex: 1 1 100%; }
  .prog-tempo { min-width: 100%; }
  .tr-scope { margin-left: 0; }
  .prog-transpose { gap: 10px; }
  .scale-map-section { padding: 14px; }
  .scale-map-chord-bar { gap: 6px; }
  .scale-map-label-toggle { margin-left: 0; }
}
`;
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(ChordModesApp));

  } catch (err) {
    var r = document.getElementById("boot");
    if (r) r.textContent = "Startup error: " + (err && err.message ? err.message : err);
    throw err;
  }
})();
